<linearGradient id="ice" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c2e3ff"/><stop offset="1" stop-color="#689bda"/></linearGradient>
<radialGradient id="aura"><stop stop-color="#77cdcd" stop-opacity=".19"/><stop offset="1" stop-color="#77cdcd" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#a7c8dd" stroke-opacity=".055"/></pattern>
