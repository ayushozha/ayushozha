<svg xmlns="http://www.w3.org/2000/svg" width="800" height="280" viewBox="0 0 800 280" role="img" aria-labelledby="title desc">
<title id="title">Product analytics — data into insight</title><desc id="desc">Three data sources merge into a dashboard of rising mint columns and blue and mint chart lines. The chart is decorative and contains no reported metrics.</desc>
